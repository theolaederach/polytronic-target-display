<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

<div class="target-container">
    {% for i in range(1, target_number + 1) %}
    <div class="container element target{{ i }}">
        <h2>Target {{ i }}</h2>
        <svg id="svg-target{{ i }}" viewBox="0 0 1024 1024">
            <image
                href="{{ url_for('static', filename='assets/target_A10.png') }}"
                width="1024"
                height="1024"
            />
        </svg>
    </div>
    {% endfor %}
</div>
{% block scripts %}
<script src="{{ url_for('static', filename='js/update-target.js') }}"></script>
<script src="{{ url_for('static', filename='js/fit-grid.js') }}"></script>
<script>
    // Démarrage
    document.addEventListener("DOMContentLoaded", () => {
        // Premier chargement immédiat
        refreshAllTargets();

        // Puis rafraîchissement toutes les secondes
        // Use recursive setTimeout to avoid overlapping requests
        async function loop() {
            await refreshAllTargets();
            setTimeout(loop, REFRESH_INTERVAL);
        }
        loop();

        console.log(
            `Système de mise à jour des cibles démarré (${REFRESH_INTERVAL}s interval)`,
        );
    });
</script>
{% endblock %}
