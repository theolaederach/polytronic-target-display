{% extends "base.html" %} {% block content %}

<div class="container">
    <form method="get">
        <label for="shooter_selector">Shooter number</label>
        <select name="shooter" id="shooter_selector"></select>
        <input type="submit" value="Show" />
    </form>
</div>
{% if data %}
<div class="container" style="width: 80vw">
    <h1>{{ data.shooter_name }}</h1>
    <canvas id="myChart"></canvas>
</div>
{% endif %} {% endblock %} {% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/statistics.js') }}"></script>
<script src="{{ url_for('static', filename='js/graphs.js') }}"></script>
<script>
    const data = {{ data | tojson }};
    console.log(data.shooter_number)
    create_line_charts(document.getElementById('myChart'), data.shots)
</script>
{% endblock %}
