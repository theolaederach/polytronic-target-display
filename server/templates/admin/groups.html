{% extends "admin/base.html" %} {% block content %}
<h1>Groups</h1>
<div class="container">
    <h2>Create a new group</h2>
    <form class="create_group">
        <label for="group_name">Group name</label>
        <input type="text" maxlength="100" placeholder="Name of the group" >

        <label for="group_society">Society</label>
        <select name="society" id="group_society">
            <option value="ici">Ici</option>
        </select>
        <div>
            {% for i in range(4) %}
            <label for="shooter_{{ i+1 }}">shooter {{ i+1 }}</label>
            <input type="number" placeholder="Shooter number" >
                {% endfor %}
        </div>
        <input type="submit" value="Create">
    </form>
</div>

<div class="container">
    <h2>List of groups</h2>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Society</th>
                <th>Shooter 1</th>
                <th>Shooter 2</th>
                <th>Shooter 3</th>
                <th>Shooter 4</th>
            </tr>
        </thead>
    </table>
</div>
{% endblock %}
