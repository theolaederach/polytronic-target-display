<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <title>Cible de Tir</title>
        <style>
            .target-container {
                max-width: 600px;
                margin: 20px auto;
            }
            svg {
                width: 100%;
                height: auto;
                border: 1px solid #ccc;
            }
            .shot-number {
                font-family: sans-serif;
                font-size: 14px;
                font-weight: bold;
                user-select: none;
            }
        </style>
        <link
            rel="shortcut icon"
            href="{{ url_for('static', filename='favicon.ico') }}"
        />
    </head>
    <body>
        <div class="target-container">
            <!-- Ajuste le viewBox aux dimensions exactes de ton image d'origine (ex: 1024x1024) -->
            <svg id="target-svg" viewBox="0 0 1024 1024">
                <!-- Image de fond -->
                <image
                    href="{{ url_for('static', filename='template.png') }}"
                    width="1024"
                    height="1024"
                />
            </svg>
        </div>

        <script src="{{ url_for('static', filename='js/update-target.js') }}"></script>
    </body>
</html>
